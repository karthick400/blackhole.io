	<script>
		(function initSpaceParticles() {
			const canvas = document.getElementById('space-particles-canvas');
			if (!canvas) {
				return;
			}

			const ctx = canvas.getContext('2d');
			if (!ctx) {
				return;
			}

			const particles = [];
			const count = 130;
			let width = 0;
			let height = 0;

			function random(min, max) {
				return Math.random() * (max - min) + min;
			}

			function resize() {
				width = window.innerWidth;
				height = window.innerHeight;
				const dpr = Math.min(window.devicePixelRatio || 1, 2);
				canvas.width = Math.floor(width * dpr);
				canvas.height = Math.floor(height * dpr);
				canvas.style.width = width + 'px';
				canvas.style.height = height + 'px';
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			}

			function createParticle() {
				return {
					x: random(0, width),
					y: random(0, height),
					vx: random(-0.22, 0.22),
					vy: random(-0.22, 0.22),
					r: random(0.7, 2.2),
					a: random(0.2, 0.85),
					h: random(0, Math.PI * 2)
				};
			}

			function seed() {
				particles.length = 0;
				for (let i = 0; i < count; i += 1) {
					particles.push(createParticle());
				}
			}

			function drawBackground() {
				ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
				ctx.fillRect(0, 0, width, height);
			}

			function draw() {
				drawBackground();

				for (let i = 0; i < particles.length; i += 1) {
					const p = particles[i];
					p.x += p.vx + Math.sin(performance.now() * 0.0004 + p.h) * 0.03;
					p.y += p.vy + Math.cos(performance.now() * 0.00035 + p.h) * 0.03;

					if (p.x < -10) p.x = width + 10;
					if (p.x > width + 10) p.x = -10;
					if (p.y < -10) p.y = height + 10;
					if (p.y > height + 10) p.y = -10;

					ctx.beginPath();
					ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
					ctx.fillStyle = 'rgba(186, 230, 253,' + p.a.toFixed(2) + ')';
					ctx.fill();
				}

				for (let i = 0; i < particles.length; i += 1) {
					for (let j = i + 1; j < particles.length; j += 1) {
						const p1 = particles[i];
						const p2 = particles[j];
						const dx = p1.x - p2.x;
						const dy = p1.y - p2.y;
						const dist = Math.hypot(dx, dy);
						if (dist < 120) {
							ctx.beginPath();
							ctx.moveTo(p1.x, p1.y);
							ctx.lineTo(p2.x, p2.y);
							ctx.strokeStyle = 'rgba(125, 211, 252,' + ((1 - dist / 120) * 0.12).toFixed(3) + ')';
							ctx.lineWidth = 1;
							ctx.stroke();
						}
					}
				}

				requestAnimationFrame(draw);
			}

			window.addEventListener('resize', resize);
			resize();
			seed();
			draw();
		})();
	</script>
	<script>
		const textarea = document.getElementById('idea-desc');
		const counter = document.getElementById('charCounter');
		const maxChars = 280;
		textarea.addEventListener('input', function() {
			const remaining = maxChars - textarea.value.length;
			counter.textContent = remaining;
			counter.classList.remove('orange', 'red');
			if (remaining < 30) {
				counter.classList.add('red');
			} else if (remaining < 80) {
				counter.classList.add('orange');
			}
		});
	</script>

					<stop offset="0%" stop-color="#7c3aed"/>
					<stop offset="100%" stop-color="#06b6d4"/>
				</linearGradient>
				<conicGradient id="conic-gradient"/>
			</defs>
			<circle cx="45" cy="45" r="36" fill="none" stroke="#232526" stroke-width="10"/>
			<circle cx="45" cy="45" r="36" fill="none" stroke="url(#ring-gradient)" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2 56.55" stroke-dashoffset="0" class="spin-ring"/>

}

	document.getElementById('loading-state').style.display = 'none';

}
const typewriterText = 'AI is analyzing your idea...';
let typewriterTimer = null;
let verdictTimer = null;
const scoreTimers = {
	feasibility: null,
	originality: null,
	impact: null
};

function getScoreColor(score) {
	if (score > 70) {
		return 'green';
	}
	if (score >= 40) {
		return 'orange';
	}
	return 'red';
}

function clampScore(value) {
	const parsed = Number(value);
	if (Number.isNaN(parsed)) {
		return 0;
	}
	return Math.max(0, Math.min(100, Math.round(parsed)));
}

function animateMetric(metric, score) {
	const scoreEl = document.getElementById(`score-${metric}`);
	const barEl = document.getElementById(`bar-${metric}`);

	if (!scoreEl || !barEl) {
		return;
	}

	clearInterval(scoreTimers[metric]);
	scoreEl.textContent = '0%';

	barEl.classList.remove('green', 'orange', 'red', 'animate');
	barEl.style.width = '0%';
	barEl.classList.add(getScoreColor(score));
	barEl.style.setProperty('--target-width', `${score}%`);
	void barEl.offsetWidth;
	barEl.classList.add('animate');

	const duration = 1500;
	const intervalMs = 30;
	const steps = Math.max(1, Math.floor(duration / intervalMs));
	let step = 0;

	scoreTimers[metric] = setInterval(() => {
		step += 1;
		const current = Math.min(score, Math.round((score * step) / steps));
		scoreEl.textContent = `${current}%`;
		if (step >= steps) {
			scoreEl.textContent = `${score}%`;
			clearInterval(scoreTimers[metric]);
			scoreTimers[metric] = null;
		}
	}, intervalMs);
}

function typeVerdict(text) {
	const verdictEl = document.getElementById('ai-verdict');
	if (!verdictEl) {
		return;
	}
	clearInterval(verdictTimer);
	verdictEl.textContent = '';
	let index = 0;
	verdictTimer = setInterval(() => {
		verdictEl.textContent = text.slice(0, index + 1);
		index += 1;
		if (index >= text.length) {
			clearInterval(verdictTimer);
			verdictTimer = null;
		}
	}, 25);
}

function displayTags(tagsArray) {
	const container = document.getElementById('tags-container');
	container.innerHTML = '';
	container.style.display = 'flex';
	container.style.flexWrap = 'wrap';
	container.style.gap = '8px';
	container.style.marginTop = '16px';

	tagsArray.forEach(function(tag, index) {
		setTimeout(function() {
			const badge = document.createElement('span');
			badge.textContent = '#' + tag;
			badge.style.backgroundColor = '#06b6d4';
			badge.style.color = 'white';
			badge.style.padding = '4px 14px';
			badge.style.borderRadius = '100px';
			badge.style.fontSize = '14px';
			badge.style.boxShadow = '0 0 8px rgba(6,182,212,0.5)';
			badge.style.animation = 'badge-pop 0.3s ease forwards';
			container.appendChild(badge);
		}, index * 200);
	});
}

function updateTeamToggleStatus() {
	const statusEl = document.getElementById('teammate-privacy-status');
	const isOpen = getTeamToggleValue();

	if (!statusEl) {
		return;
	}

	if (isOpen) {
		statusEl.textContent = 'Your idea will be visible for team matching';
		statusEl.classList.add('open');
	} else {
		statusEl.textContent = 'Your idea will be saved privately';
		statusEl.classList.remove('open');
	}
}

function populateTeammateCard(data) {
	const card = document.getElementById('teammate-card');
	const rolesContainer = document.getElementById('teammate-roles');
	const sizeEl = document.getElementById('teammate-size');

	if (!card || !rolesContainer || !sizeEl) {
		return;
	}

	const result = data || {};
	const roles = Array.isArray(result.suggestedRoles) ? result.suggestedRoles : [];
	const teamSize = result.suggestedTeamSize;

	rolesContainer.innerHTML = '';
	roles.forEach((role) => {
		if (!role) {
			return;
		}
		const pill = document.createElement('span');
		pill.className = 'role-pill';
		pill.textContent = String(role);
		rolesContainer.appendChild(pill);
	});

	if (roles.length === 0) {
		const fallback = document.createElement('span');
		fallback.className = 'role-pill';
		fallback.textContent = 'Generalist';
		rolesContainer.appendChild(fallback);
	}

	sizeEl.textContent = `Suggested team size: ${teamSize || '--'}`;
	card.style.display = 'block';
	updateTeamToggleStatus();
}

function getTeamToggleValue() {
	const toggleEl = document.getElementById('teammate-toggle');
	return Boolean(toggleEl && toggleEl.checked);
}

const teammateToggle = document.getElementById('teammate-toggle');
if (teammateToggle) {
	teammateToggle.addEventListener('change', updateTeamToggleStatus);
	updateTeamToggleStatus();
}

function displayAIResults(data) {
	const result = data || {};
	const feasibility = clampScore(result.feasibility);
	const originality = clampScore(result.originality);
	const impact = clampScore(result.impact);
	const verdict = typeof result.verdict === 'string' && result.verdict.trim()
		? result.verdict.trim()
		: 'No verdict available.';

	animateMetric('feasibility', feasibility);
	animateMetric('originality', originality);
	animateMetric('impact', impact);
	typeVerdict(verdict);
	displayTags(data.tags);
	populateTeammateCard(data);

	document.getElementById('ai-results').style.display = 'flex';
}

const ideaForm = document.querySelector('.glass-card');

if (ideaForm) {
	ideaForm.addEventListener('submit', async function(event) {
		event.preventDefault();

		// Step 1: Read title and description
		const titleEl = document.getElementById('idea-title');
		const descEl = document.getElementById('idea-desc');
		const title = titleEl ? titleEl.value.trim() : '';
		const description = descEl ? descEl.value.trim() : '';

		// Step 2: Validate and add shake-error class if empty
		if (!title) {
			if (titleEl) {
				titleEl.classList.add('shake-error');
				setTimeout(() => titleEl.classList.remove('shake-error'), 300);
			}
		}
		if (!description) {
			if (descEl) {
				descEl.classList.add('shake-error');
				setTimeout(() => descEl.classList.remove('shake-error'), 300);
			}
		}
		if (!title || !description) {
			return;
		}

		// Step 3: Show loading
		document.getElementById('ai-results').style.display = 'none';
		showLoading();

		try {
			// Step 4: Call analyzeIdea (async)
			const result = await analyzeIdea(title, description);

			// Save idea automatically, then redirect to dashboard.
			const isOpenToTeam = getTeamToggleValue();
			let currentUser = getCurrentUser();
			if (!currentUser) {
				currentUser = {
					id: 'guest-' + Date.now(),
					name: 'Guest User',
					email: 'guest@blackhole.io'
				};
			}

			const ideaObject = {
				id: 'idea-' + Date.now(),
				title: title,
				description: description,
				userId: currentUser.id,
				userName: currentUser.name,
				userEmail: currentUser.email,
				openToTeammates: isOpenToTeam,
				tags: result.tags || [],
				feasibility: result.feasibility || 0,
				originality: result.originality || 0,
				impact: result.impact || 0,
				verdict: result.verdict || '',
				suggestedTeamSize: result.suggestedTeamSize || '',
				suggestedRoles: result.suggestedRoles || [],
				createdAt: new Date().toISOString()
			};

			await saveIdea(ideaObject);

			const typewriterEl = document.querySelector('#loading-typewriter .typewriter-text');
			if (typewriterEl) {
				typewriterEl.textContent = 'Warping to dashboard...';
			}

			setTimeout(() => {
				window.location.href = 'explore.html';
			}, 900);
			
		} catch (error) {
			console.error('Analysis failed:', error);
			hideLoading();
			ideaForm.style.display = 'flex';
		}
	});
}

function startTypewriter() {
	const el = document.querySelector('#loading-typewriter .typewriter-text');
	el.textContent = '';
	let i = 0;
	clearInterval(typewriterTimer);
	typewriterTimer = setInterval(() => {
		el.textContent = typewriterText.slice(0, i+1);
		i++;
		if (i >= typewriterText.length) clearInterval(typewriterTimer);
	}, 38);
}
