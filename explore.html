<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Ideas | BlackHole.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWix+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8J4J8L+H5Qz8C4W2Y8M2R7N2R5Q4hQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    :root {
      --bg: #000000;
      --surface: #111111;
      --text: #ffffff;
      --muted: #9ca3af;
      --gold: #f59e0b;
      --purple: #7c3aed;
      --purple-strong: #6d28d9;
      --ring: 0 0 0 3px rgba(245, 158, 11, 0.26);
      --max-width: 1200px;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(124, 58, 237, 0.18), transparent 36%),
        radial-gradient(circle at 85% 22%, rgba(245, 158, 11, 0.15), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(124, 58, 237, 0.1), transparent 50%),
        var(--bg);
      font-family: "Manrope", "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .navbar-logo,
    .page-title,
    .idea-title {
      font-family: "Sora", "Manrope", sans-serif;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 120;
      background: #000000;
      border-bottom: 1px solid rgba(245, 158, 11, 0.24);
      backdrop-filter: blur(8px);
    }

    .navbar-content {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .navbar-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text);
      font-size: 1.15rem;
    }

    .navbar-logo img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      border-radius: 6px;
    }

    .navbar-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      color: #d1d5db;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-profile-link {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .nav-profile-link:hover {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.7);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--gold);
    }

    .page-shell {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      padding: 2.25rem 1.5rem 5rem;
    }

    .page-header {
      margin-bottom: 1.2rem;
      animation: riseIn 500ms ease;
    }

    .page-title {
      margin: 0;
      color: #ffffff;
      font-size: clamp(2.1rem, 4.8vw, 3rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .page-subtitle {
      margin: 0.55rem 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    #filter-bar {
      position: sticky;
      top: 68px;
      z-index: 110;
      margin-top: 1.25rem;
      animation: riseIn 650ms ease;
    }

    .filter-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
      background: #111111;
      border: 1px solid rgba(245, 158, 11, 0.24);
      border-radius: 14px;
      padding: 0.9rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .custom-dropdown {
      position: relative;
      min-width: 190px;
      flex: 0 0 auto;
    }

    .custom-dropdown-button,
    .filter-dropdown,
    #search-input {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #0b0b0b;
      color: #ffffff;
      font-size: 0.97rem;
      font-weight: 600;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .custom-dropdown-button {
      padding: 0 2.2rem 0 0.9rem;
      text-align: left;
      cursor: pointer;
      position: relative;
    }

    .custom-dropdown-button::after {
      content: "▾";
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: 0.92rem;
      pointer-events: none;
    }

    .filter-dropdown {
      min-width: 170px;
      padding: 0 0.9rem;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(1.15rem), calc(100% - 10px) calc(1.15rem);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 2rem;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 280px;
      min-width: 220px;
    }

    #search-input {
      padding: 0 2.5rem 0 0.9rem;
      outline: none;
    }

    .search-icon {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #d1d5db;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .custom-dropdown-button:focus,
    .filter-dropdown:focus,
    #search-input:focus {
      border-color: var(--gold);
      box-shadow: var(--ring);
      outline: none;
    }

    .custom-dropdown-list {
      position: absolute;
      top: calc(100% + 0.5rem);
      left: 0;
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(245, 158, 11, 0.4);
      background: #0b0b0b;
      display: none;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      z-index: 200;
    }

    .custom-dropdown.open .custom-dropdown-list {
      display: block;
    }

    .custom-dropdown-option {
      width: 100%;
      border: 0;
      background: transparent;
      color: #ffffff;
      text-align: left;
      font-size: 0.95rem;
      padding: 0.65rem 0.75rem;
      cursor: pointer;
    }

    .custom-dropdown-option:hover {
      background: rgba(245, 158, 11, 0.14);
      color: #fff6df;
    }

    main {
      margin-top: 1.4rem;
      animation: riseIn 720ms ease;
    }

    #ideas-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .idea-card {
      background: #111111 !important;
      border-left: 3px solid var(--gold) !important;
      border-radius: 12px !important;
      border-top: 1px solid rgba(245, 158, 11, 0.12) !important;
      border-right: 1px solid rgba(245, 158, 11, 0.12) !important;
      border-bottom: 1px solid rgba(245, 158, 11, 0.12) !important;
      padding: 20px !important;
      margin-bottom: 0 !important;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.42);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .idea-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.55);
      border-left-color: #fbbf24 !important;
    }

    .owner-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    .owner-emoji {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      border: 1px solid rgba(245, 158, 11, 0.5);
      font-size: 1.15rem;
      flex: 0 0 40px;
    }

    .owner-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      margin-right: auto;
    }

    .owner-name {
      color: #ffffff;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .owner-college {
      color: #9ca3af;
      font-size: 0.84rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-ago {
      color: #6b7280;
      font-size: 0.82rem;
      font-weight: 600;
      margin-left: auto;
    }

    .idea-title {
      margin: 0 0 0.9rem;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .tags-row span {
      background: rgba(245, 158, 11, 0.22) !important;
      color: #fcd37f !important;
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 999px !important;
      font-size: 0.76rem !important;
      font-weight: 700;
      padding: 0.24rem 0.62rem !important;
      margin-right: 0 !important;
      display: inline-flex !important;
      align-items: center;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    .react-btn,
    .join-btn {
      border: 0;
      border-radius: 9px;
      padding: 0.52rem 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      white-space: nowrap;
      font-size: 0.88rem;
    }

    .react-btn {
      background: var(--purple);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .join-btn {
      background: var(--purple);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-width: 132px;
      justify-content: center;
    }

    .join-btn:hover {
      background: var(--purple-strong);
    }

    .react-btn:hover,
    .join-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .heat-label {
      margin-left: auto;
      color: #fbbf24;
      font-weight: 700;
      font-size: 0.84rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .heat-value {
      color: var(--gold);
      font-weight: 800;
    }

    #empty-state {
      display: none;
      text-align: center;
      color: #9ca3af;
      font-size: 1.06rem;
      padding: 2.3rem 1rem;
      border-radius: 12px;
      border: 1px dashed rgba(245, 158, 11, 0.38);
      background: #111111;
      margin-top: 1.2rem;
    }

    #floating-submit-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 300;
      background: var(--purple);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.01em;
      padding: 0.95rem 1.35rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 30px rgba(124, 58, 237, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
      backdrop-filter: blur(8px);
    }

    #floating-submit-btn:hover {
      transform: translateY(-2px);
      background: var(--purple-strong);
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 980px) {
      #ideas-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .navbar-content {
        height: auto;
        padding: 0.8rem 1rem;
        flex-wrap: wrap;
        gap: 0.65rem;
      }

      .navbar-links {
        width: 100%;
        justify-content: flex-start;
        gap: 1rem;
      }

      #filter-bar {
        top: 96px;
      }

      .filter-wrap {
        padding: 0.75rem;
      }

      .custom-dropdown,
      .filter-dropdown,
      .search-wrap {
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      #ideas-grid {
        grid-template-columns: 1fr;
      }

      #floating-submit-btn {
        right: 16px;
        bottom: 16px;
        padding: 0.86rem 1.12rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar glassmorphism">
    <div class="navbar-content">
      <div class="navbar-logo"><img src="assets/logo.png" alt="BlackHole logo" onerror="this.style.display='none'"><span>BlackHole.io</span></div>
      <div class="navbar-links">
        <a href="explore.html" class="nav-link active">Explore</a>
        <a href="submit.html" class="nav-link">Submit Idea</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="profile.html" class="nav-profile-link" aria-label="Profile"><i class="fa-regular fa-user"></i></a>
      </div>
    </div>
  </nav>

  <div class="page-shell">
    <header class="page-header">
      <h1 class="page-title">Explore Ideas</h1>
      <p class="page-subtitle">Discover what students are building</p>
    </header>

    <div id="filter-bar">
      <div class="filter-wrap">
        <div class="custom-dropdown" id="tag-filter-dropdown">
          <button type="button" class="custom-dropdown-button" aria-haspopup="listbox" aria-expanded="false">
            <span class="custom-dropdown-text">All Tags</span>
          </button>
          <div class="custom-dropdown-list" role="listbox" aria-label="Tag Filter Options">
            <button type="button" class="custom-dropdown-option" role="option" data-value="All Tags">All Tags</button>
            <button type="button" class="custom-dropdown-option" role="option" data-value="EdTech">EdTech</button>
            <button type="button" class="custom-dropdown-option" role="option" data-value="HealthTech">HealthTech</button>
            <button type="button" class="custom-dropdown-option" role="option" data-value="SocialGood">SocialGood</button>
            <button type="button" class="custom-dropdown-option" role="option" data-value="DevTools">DevTools</button>
            <button type="button" class="custom-dropdown-option" role="option" data-value="Environment">Environment</button>
          </div>
          <input type="hidden" id="tag-filter-value" value="All Tags">
          <input type="hidden" id="tag-filter" value="All Tags">
        </div>

        <select id="sort-filter" class="filter-dropdown">
          <option>Hottest</option>
          <option>Newest</option>
          <option>Most Needed</option>
        </select>

        <div class="search-wrap">
          <input id="search-input" type="text" placeholder="Search ideas...">
          <span class="search-icon" aria-hidden="true">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <main>
      <div id="ideas-grid">
      </div>
      <div id="empty-state">
        <i class="fa-regular fa-lightbulb" aria-hidden="true"></i> No ideas yet - be the first!
      </div>
    </main>
  </div>

  <a href="submit.html" id="floating-submit-btn">Submit Your Idea <i class="fa-solid fa-star" aria-hidden="true"></i></a>

  <script src="js/ideas.js"></script>
  <script src="js/users.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/heat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/gemini.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const dropdown = document.getElementById('tag-filter-dropdown');
      if (!dropdown) {
        return;
      }

      const dropdownButton = dropdown.querySelector('.custom-dropdown-button');
      const dropdownList = dropdown.querySelector('.custom-dropdown-list');
      const dropdownText = dropdown.querySelector('.custom-dropdown-text');
      const hiddenTagValue = document.getElementById('tag-filter-value');
      const legacyTagValue = document.getElementById('tag-filter');

      dropdownButton.addEventListener('click', function() {
        const isOpen = dropdown.classList.toggle('open');
        dropdownButton.setAttribute('aria-expanded', String(isOpen));
      });

      dropdownList.addEventListener('click', function(event) {
        const option = event.target.closest('.custom-dropdown-option');
        if (!option) {
          return;
        }

        const selectedValue = option.getAttribute('data-value') || 'All Tags';
        dropdownText.textContent = selectedValue;
        hiddenTagValue.value = selectedValue;
        if (legacyTagValue) {
          legacyTagValue.value = selectedValue;
          legacyTagValue.dispatchEvent(new Event('change'));
        }

        dropdown.classList.remove('open');
        dropdownButton.setAttribute('aria-expanded', 'false');
      });

      document.addEventListener('click', function(event) {
        if (!dropdown.contains(event.target)) {
          dropdown.classList.remove('open');
          dropdownButton.setAttribute('aria-expanded', 'false');
        }
      });
    });
  </script>
</body>
</html>
